<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taking you there — Top Speed Service OS</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/fonts.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#0C162B;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
  .card{background:#fff;color:#0C162B;border-radius:20px;max-width:430px;width:100%;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.4);text-align:center}
  .ic{width:52px;height:52px;border-radius:16px;background:#0C162B;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .ic svg{width:28px;height:28px}
  h1{font-size:20px;margin:0 0 8px}
  p{font-size:14.5px;line-height:1.55;color:#43536B;margin:0 0 14px}
  .btn{display:inline-block;background:#E94E5C;color:#fff;text-decoration:none;font-weight:800;border-radius:999px;padding:12px 22px;font-size:15px}
  .spin{width:34px;height:34px;border-radius:50%;border:3.5px solid #D8E1EE;border-top-color:#E94E5C;margin:6px auto 14px;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></div>
    <h1 id="title">Taking you there…</h1>
    <div class="spin" id="spin"></div>
    <p id="msg">Carrying your sign-in with you.</p>
    <p id="fallback" style="display:none"><a class="btn" href="/">Back to Top Speed Service OS</a></p>
  </div>

<script src="/shared/session-vault.js"></script>
<script>
(function () {
  var API = 'https://top-speed-service-os.vercel.app/api/v1';
  var params = new URLSearchParams(location.search);
  var target = params.get('to') || '';

  function refuse(msg) {
    document.getElementById('spin').style.display = 'none';
    document.getElementById('title').textContent = 'That destination is not part of the platform';
    document.getElementById('msg').textContent = msg;
    document.getElementById('fallback').style.display = 'block';
  }
  function goPlain(url) { location.replace(url); }

  var u = null;
  try { u = new URL(target); } catch (e) { u = null; }
  if (!u || (u.protocol !== 'https:' && u.protocol !== 'http:')) {
    refuse('This link does not name a valid platform address.');
    return;
  }
  // ONE allowlist governs every cross-host handoff (documented
  // server-side in services/sessionHandoff.js): a signed-in session is
  // only ever carried to a Top Speed platform host.
  var hosts = (window.TSOSVault && window.TSOSVault.HANDOFF_HOSTS) || [];
  if (hosts.indexOf(u.hostname) === -1) {
    refuse('Signed-in travel only works between Top Speed platform sites, and that address is not one of them.');
    return;
  }
  // Same host: the vault already covers this origin — just go.
  if (u.origin === location.origin) { goPlain(u.href); return; }
  // No session here: never block a signed-out visitor — plain link.
  var tok = window.TSOSVault ? window.TSOSVault.token() : null;
  if (!tok) { goPlain(u.href); return; }

  fetch(API + '/auth/handoff', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok },
    body: JSON.stringify({})
  }).then(function (r) {
    return r.json().then(function (j) { return { ok: r.ok, j: j }; });
  }).then(function (res) {
    if (!res.ok || !res.j || !res.j.code) { goPlain(u.href); return; }
    var dest = u.origin + '/auth-handoff/?hc=' + encodeURIComponent(res.j.code) +
      '&to=' + encodeURIComponent(u.pathname + u.search + u.hash);
    location.replace(dest);
  }).catch(function () {
    // The carry failed, the trip must not: go without the session.
    goPlain(u.href);
  });
})();
</script>
<script src="/shared/page-slider.js" defer></script>
</body>
</html>
